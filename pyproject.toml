[build-system]
# >=77 for PEP 639 SPDX license expressions.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-world-tui"
version = "1.0.0"
description = "The Hands — the terminal app for expense_world_engine."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tzlocal>=5.2",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "mypy>=1.14",
    "pytest-cov>=5",
    "pytest-xdist>=3.6",
    # Builds the made-up sheets the tests send; the app never reads a workbook.
    "openpyxl>=3.1",
]

[project.scripts]
expense = "expense.__main__:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["expense*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# Typer's whole API is `param: T = typer.Option(...)` in the signature — the calls
# are its declaration syntax, not mutable defaults. B008 auto-exempts plain-typed
# options but not Enum-typed ones, so allowlist them explicitly (Typer's documented
# ruff config) to keep the exemption uniform.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

# Permissive start, scoped to the plumbing that passes engine JSON around
# (backlog 4.2); widen the file list / tighten flags as modules get annotated.
[tool.mypy]
python_version = "3.11"
mypy_path = "scripts"
# Errors in modules not yet in `files` stay quiet; every listed module is checked in full.
follow_imports = "silent"
files = ["expense/__init__.py", "expense/__main__.py", "expense/bank_import/__init__.py", "expense/bank_import/engine.py", "expense/bank_import/flow.py", "expense/bank_import/statement.py", "expense/bank_line_write.py", "expense/batch_write.py", "expense/commands/__init__.py", "expense/commands/import_cmd.py", "expense/config.py", "expense/context.py", "expense/currencies.py", "expense/dates.py", "expense/errors.py", "expense/formatting.py", "expense/http.py", "expense/import_/__init__.py", "expense/import_/engine.py", "expense/jsonout.py", "expense/number_format.py", "expense/quickadd/__init__.py", "expense/quickadd/money.py", "expense/quickadd/names.py", "expense/quickadd/parse.py", "expense/quickadd/payload.py", "expense/quickadd/route.py", "expense/quickadd/when.py", "expense/reads.py", "expense/region.py", "expense/tui/__init__.py", "expense/tui/app.py", "expense/tui/dropped.py", "expense/tui/screens/__init__.py", "expense/tui/screens/_form.py", "expense/tui/screens/_growing.py", "expense/tui/screens/bulk_pick.py", "expense/tui/screens/categories.py", "expense/tui/screens/hashtags.py", "expense/tui/screens/help.py", "expense/tui/screens/home.py", "expense/tui/screens/modals.py", "expense/tui/screens/setup.py", "expense/tui/theme.py", "expense/tui/widgets/__init__.py", "expense/tui/widgets/cells.py", "expense/tui/widgets/checklist.py", "expense/tui/widgets/cursor_list.py", "expense/tui/widgets/footer.py", "expense/tui/widgets/header.py", "expense/tui/widgets/parts_table.py", "expense/tui/widgets/picker.py", "expense/tui/widgets/refusal.py", "expense/tui/widgets/windowed.py", "scripts/release.py", "scripts/prepare_release.py"]
check_untyped_defs = true
warn_unused_ignores = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default (pytest-xdist): `-n0` on the command line forces one process.
# Set here rather than in a conftest because pytest-cov reads `-n` before any
# conftest loads. tests/contract/conftest.py turns "auto" into zero workers, so a
# live contract run stays serial.
addopts = ["-n", "auto"]

[tool.coverage.run]
source = ["expense"]
